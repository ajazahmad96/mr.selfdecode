<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mr.SelfDecode</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Sora:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CSS Variables & Color Palette --- */
        :root {
            --bg-main: #050816;
            --bg-sec: #0B1023;
            --text-pri: #F5F7FF;
            --text-sec: #AAB2D5;
            --neon-purple: #8B5CF6;
            --electric-blue: #3B82F6;
            --cyan-accent: #22D3EE;
            
            --font-head: 'Space Grotesk', sans-serif;
            --font-body: 'Poppins', sans-serif;
            --font-ui: 'Sora', sans-serif;
            
            --glass-bg: rgba(11, 16, 35, 0.4);
            --glass-border: rgba(255, 255, 255, 0.05);
            --glass-glow: 0 8px 32px 0 rgba(139, 92, 246, 0.15);
        }

        /* --- Global Reset --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-main); color: var(--text-pri); font-family: var(--font-body); }

        /* --- Navigation --- */
        header {
            position: fixed; top: 0; width: 100%; padding: 20px 5%;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; background: rgba(5, 8, 22, 0.8); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo { font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--cyan-accent); }
        .nav-links { display: flex; gap: 2rem; font-family: var(--font-ui); }
        .nav-links a:hover, .nav-links a.active-link { color: var(--cyan-accent); }

        /* --- Contact Layout --- */
        .contact-container {
            padding: 150px 5% 100px;
            max-width: 800px;
            margin: 0 auto;
        }

        .gradient-text {
            background: linear-gradient(to right, var(--cyan-accent), var(--neon-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- Form Styling --- */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 3rem;
        }

        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text-sec); font-size: 0.9rem; }
        input, textarea {
            width: 100%; padding: 12px; background: #050816; border: 1px solid var(--glass-border);
            border-radius: 8px; color: var(--text-pri); outline: none;
            transition: border 0.3s ease;
        }
        input:focus, textarea:focus { border-color: var(--neon-purple); }

        .btn-submit {
            background: linear-gradient(45deg, var(--neon-purple), var(--electric-blue));
            border: none; padding: 15px 30px; border-radius: 8px;
            color: white; font-weight: 600; cursor: pointer; width: 100%;
            transition: transform 0.3s ease;
        }
        .btn-submit:hover { transform: translateY(-2px); }

        /* --- Footer --- */
        footer { padding: 3rem 5%; text-align: center; border-top: 1px solid var(--glass-border); }
        .social-links { display: flex; justify-content: center; gap: 1.5rem; font-size: 1.5rem; margin-bottom: 1rem; }
        .social-links a { color: var(--text-sec); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-brain"></i> <span>Mr.Self<span class="gradient-text">Decode</span></span></div>
        <nav><ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="contact.html" class="active-link">Contact</a></li>
        </ul></nav>
    </header>

    <div class="contact-container">
        <h1 style="font-family: var(--font-head); margin-bottom: 1rem;">Let's <span class="gradient-text">Connect.</span></h1>
        <p style="color: var(--text-sec); margin-bottom: 3rem;">Ready to build systems? Have a question or a partnership proposal? Send a message and let's decode the future together.</p>

        <div class="glass-card">
            <form id="contactForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Inquiry Type</label>
                    <select style="width: 100%; padding: 12px; background: #050816; border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-pri);">
                        <option>Partnership</option>
                        <option>Coaching/Mentorship</option>
                        <option>Development Project</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" placeholder="What's on your mind?"></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Transmission</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-discord"></i></a>
        </div>
        <p style="color: var(--text-sec); font-size: 0.9rem;">&copy; 2026 Mr.SelfDecode by Ajaz Ahmad.</p>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Message received. System processing...');
        });
    </script>
</body>
</html>
